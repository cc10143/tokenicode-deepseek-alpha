[changelog]
# NOTE: CHANGELOG.md is hand-maintained (2126 lines of curated, versioned
# entries) — do NOT run `git-cliff -o CHANGELOG.md` which would overwrite it.
# Use `git-cliff -o /tmp/changelog.md` or pipe to stdout for on-demand release
# notes (e.g. before cutting a GitHub Release), and merge selectively by hand.
header = """
# Changelog

本项目的变更记录。格式遵循 Conventional Commits，由 git-cliff 自动生成。

"""
body = """
{%- if version %}\n## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}\n{% else %}\n## [Unreleased]\n{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits | unique(attribute="message") %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# This fork's commit history mixes a few conventions:
#   - fix:/feat:/docs:/perf:/refactor:  (Conventional Commits)
#   - @ cleanup: / @ perf: / @ feat:    (repo-local custom prefixes)
# Parsers below cover both. conventional_commits is off so the `@` prefix
# (non-standard) is not rejected by git-cliff's strict parser.
conventional_commits = false
commit_parsers = [
  { message = "^@ perf", group = "Performance" },
  { message = "^@ feat", group = "Features" },
  { message = "^@ cleanup", group = "Chore / Cleanup" },
  { message = "^@", group = "Chore / Cleanup" },
  { message = "^fix", group = "Fixes" },
  { message = "^feat", group = "Features" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^build|^ci", group = "Build / CI" },
  { message = "^test", group = "Tests" },
  # Upstream base commits (pre-fork, non-conventional English sentences) are
  # skipped so the changelog only reflects this fork's own changes.
  { message = ".*", skip = true },
]
filter_commits = false
# No local release tags yet — keep everything under [Unreleased]. Set a tag
# pattern (e.g. "v[0-9]+") once release tagging starts.
tag_pattern = "NONE_MATCH"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
